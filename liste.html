<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<meta name="theme-color" content="#0D1322">
<title>Einkaufsliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Handy-Ansicht der Einkaufsliste – nutzt denselben Vermittler und Schlüssel wie das Wand-Dashboard */
:root{
  --bg:#0D1322; --tile:#1A2238; --tile2:#232C47; --fg:#F4F1EA; --muted:#9FB4DB; --soft:#C9D4EA; --green:#8ED39A; --ink:#0E2A14;
  --display:'Outfit', 'Helvetica Neue', sans-serif; --body:'Nunito Sans', -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body)}
body{padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
h1{font-family:var(--display);font-weight:500;font-size:30px;margin:0}
#state{font-size:14px;font-weight:700;color:var(--muted)}
form.add{display:flex;position:sticky;top:0;background:var(--bg);padding:6px 0 12px;z-index:1}
input{flex:1;min-width:0;height:52px;border-radius:16px;border:2px solid var(--tile2);background:var(--tile);color:var(--fg);font-size:18px;padding:0 14px;font-family:var(--body)}
input:focus{outline:none;border-color:var(--green)}
.btn{height:52px;border:0;border-radius:999px;padding:0 20px;margin-left:10px;font-size:17px;font-weight:700;background:var(--green);color:var(--ink);cursor:pointer;font-family:var(--body);flex-shrink:0}
.btn.alt{background:var(--tile2);color:var(--fg);margin:0}
.item{display:flex;align-items:center;width:100%;background:var(--tile);border:0;border-radius:14px;padding:0 14px;min-height:54px;margin-top:8px;font-size:18px;font-weight:600;color:var(--fg);text-align:left;cursor:pointer;font-family:var(--body)}
.box{width:26px;height:26px;border-radius:8px;border:3px solid var(--green);margin-right:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.item.done{opacity:.5}
.item.done .t{text-decoration:line-through}
.item.done .box{background:var(--green)}
.t{overflow-wrap:anywhere;padding:12px 0}
h2{font-size:15px;font-weight:700;color:var(--green);margin:24px 0 10px}
.chips{display:flex;flex-wrap:wrap;margin:-4px}
.chips button{background:var(--tile2);border:0;border-radius:999px;padding:9px 14px;margin:4px;font-size:16px;font-weight:600;color:var(--fg);cursor:pointer;font-family:var(--body)}
.chips button:before{content:'+ ';color:var(--green);font-weight:700}
.empty{color:var(--soft);font-size:17px;padding:14px 2px}
#clear{width:100%;margin-top:18px}
.setup{background:var(--tile);border-radius:20px;padding:18px}
.setup p{color:var(--soft);line-height:1.45;margin:6px 0 14px}
.setup form{display:flex}
#msg{font-weight:700;min-height:22px;margin-top:10px}
button:focus-visible,input:focus-visible{outline:3px solid #FFD27A;outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Einkaufsliste</h1><span id="state" role="status"></span></header>

<section id="setup" class="setup" hidden>
  <strong>Zugangsschlüssel</strong>
  <p>Einmal denselben Schlüssel wie am Tablet eintragen. Er bleibt nur auf diesem Handy gespeichert.</p>
  <form id="keyForm" autocomplete="off">
    <input id="keyIn" type="password" autocapitalize="off" spellcheck="false" placeholder="Zugangsschlüssel" aria-label="Zugangsschlüssel">
    <button class="btn" type="submit">Verbinden</button>
  </form>
  <div id="msg" role="status"></div>
</section>

<main id="app" hidden>
  <form id="addForm" class="add" autocomplete="off">
    <input id="addIn" type="text" maxlength="80" placeholder="Was fehlt?" aria-label="Neuer Eintrag" enterkeyhint="done">
    <button class="btn" type="submit">Dazu</button>
  </form>
  <div id="list"></div>
  <button id="clear" class="btn alt" type="button" hidden>Erledigte entfernen</button>
  <h2 id="recentHead" hidden>Schnell wieder hinzufügen</h2>
  <div id="recent" class="chips"></div>
</main>

<script>
(function(){
  'use strict';
  var URL_LIST = 'https://wand-dashboard.wanddash-5cqf4.workers.dev/list/einkauf';
  var KEY = 'wanddash.calkey.v1'; // derselbe Schlüssel wie im Dashboard
  var data = null, busy = false;

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function getKey(){ try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setKey(k){ try { if (k) localStorage.setItem(KEY, k); else localStorage.removeItem(KEY); } catch (e) {} }

  function req(method, body, key){
    var opt = { method: method, headers: { 'Authorization': 'Bearer ' + (key || getKey()) }, cache: 'no-store' };
    if (body){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    return fetch(URL_LIST, opt).then(function(r){
      if (r.status === 401) throw new Error('auth');
      if (r.status === 409) throw new Error('full');
      if (!r.ok) throw new Error('net');
      return r.json();
    });
  }
  function fail(e){
    var m = e && e.message;
    if (m === 'auth'){ setKey(''); showSetup('Der gespeicherte Schlüssel stimmt nicht mehr.'); return; }
    $('state').textContent = m === 'full' ? 'Liste ist voll' : 'Nicht erreichbar';
  }
  function load(){
    if (!getKey()){ showSetup(''); return; }
    req('GET').then(function(d){ data = d; render(); }).catch(fail);
  }
  function act(body){
    if (busy) return; busy = true;
    req('POST', body).then(function(d){ data = d; render(); }).catch(function(e){ fail(e); load(); }).then(function(){ busy = false; });
  }
  function showSetup(msg){
    $('setup').hidden = false; $('app').hidden = true; $('state').textContent = '';
    $('msg').textContent = msg || '';
  }
  function render(){
    $('setup').hidden = true; $('app').hidden = false;
    var items = data.items, open = items.filter(function(x){ return !x.done; }), done = items.filter(function(x){ return x.done; });
    $('state').textContent = open.length + ' offen';
    $('list').innerHTML = items.length ? open.concat(done).map(function(x){
      return '<button class="item' + (x.done ? ' done' : '') + '" type="button" data-id="' + esc(x.id) + '"><span class="box">' +
        (x.done ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0E2A14" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>' : '') +
        '</span><span class="t">' + esc(x.text) + '</span></button>';
    }).join('') : '<div class="empty">Die Liste ist leer.</div>';
    $('clear').hidden = !done.length;
    var onList = {}; items.forEach(function(x){ onList[x.text.toLowerCase()] = true; });
    var rec = data.recent.filter(function(t){ return !onList[t.toLowerCase()]; });
    $('recentHead').hidden = !rec.length;
    $('recent').innerHTML = rec.map(function(t){ return '<button type="button" data-t="' + esc(t) + '">' + esc(t) + '</button>'; }).join('');
  }

  $('keyForm').addEventListener('submit', function(e){
    e.preventDefault();
    var k = $('keyIn').value.trim();
    if (!k){ $('msg').textContent = 'Bitte den Schlüssel eingeben.'; return; }
    $('msg').textContent = 'Wird geprüft …';
    req('GET', null, k).then(function(d){ setKey(k); $('keyIn').value = ''; data = d; render(); })
      .catch(function(e){ $('msg').textContent = e.message === 'auth' ? 'Der Schlüssel stimmt nicht.' : 'Gerade nicht erreichbar.'; });
  });
  $('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var t = $('addIn').value.trim();
    if (!t) return;
    $('addIn').value = '';
    act({ op: 'add', text: t });
  });
  $('list').addEventListener('click', function(e){
    var b = e.target.closest('[data-id]');
    if (b) act({ op: 'toggle', id: b.getAttribute('data-id') });
  });
  $('recent').addEventListener('click', function(e){
    var b = e.target.closest('[data-t]');
    if (b) act({ op: 'add', text: b.getAttribute('data-t') });
  });
  $('clear').addEventListener('click', function(){ act({ op: 'clearDone' }); });

  // Beim Zurückkehren in die App und alle 30 Sekunden auffrischen
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
  setInterval(function(){ if (!document.hidden && getKey()) load(); }, 30000);
  load();
})();
</script>
</body>
</html>
